name: Cel aktualizacji dokumentacji

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documentation-goal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-code-documentation:
    name: Aktualizuj dokumentację po merge
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod po merge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skonfiguruj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Zainstaluj zależności
        run: npm ci

      - name: Uruchom cel generowania dokumentacji
        run: npm run docs:generate

      - name: Sprawdź dokumentację i aplikację
        run: |
          npm run docs:check
          npm test
          npm run build

      - name: Zapisz aktualizację na gałęzi docelowej
        run: |
          if git diff --quiet -- docs/index.html; then
            echo "Dokumentacja nie wymaga zmian."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "docs: aktualizuj indeks kodu po merge [skip ci]"
          git push
