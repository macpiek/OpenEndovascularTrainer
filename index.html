<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Endovascular Trainer</title>
    <link rel="stylesheet" href="style.css?v=20260612catheter20">
</head>
<body>
<canvas id="sim"></canvas>
<div id="controls">
    <div id="insertedLength">0 cm</div>
    <div id="catheterLength">Pigtail 0 cm</div>
    <div id="currentDose">0 ml</div>

    <div class="control-section">
        <div class="section-header collapsed"><span class="collapse-triangle">▼</span> Guidewire</div>
        <div class="section-content hidden">
            <label class="parameter-label">Bending stiffness
                <input id="stiffness" type="range" min="0" max="2" step="0.1" value="0.8">
                <span></span>
            </label>
            <label class="parameter-label">Smoothing iterations
                <input id="smoothIterations" type="range" min="0" max="10" step="1" value="1">
                <span></span>
            </label>
        </div>
    </div>

    <div class="control-section">
        <div class="section-header"><span class="collapse-triangle">▼</span> Pigtail catheter</div>
        <div class="section-content">
            <div class="tool-button-row">
                <button id="catheterWithdraw" title="Withdraw pigtail catheter">Withdraw</button>
                <button id="catheterAdvance" title="Advance pigtail catheter">Advance</button>
            </div>
            <div class="tool-button-row">
                <button id="catheterRotateLeft" title="Rotate pigtail catheter counterclockwise">↺ Rotate</button>
                <button id="catheterRotateRight" title="Rotate pigtail catheter clockwise">Rotate ↻</button>
            </div>
            <div class="tool-hint">A/D advance · Q/E rotate</div>
        </div>
    </div>

    <div class="control-section">
        <div class="section-header collapsed"><span class="collapse-triangle">▼</span> Friction</div>
        <div class="section-content hidden">
            <label class="parameter-label">Static friction
                <input id="staticFriction" type="range" min="0" max="1" step="0.01" value="0.03">
                <span></span>
            </label>
            <label class="parameter-label">Kinetic friction
                <input id="kineticFriction" type="range" min="0" max="1" step="0.01" value="0.01">
                <span></span>
            </label>
        </div>
    </div>

    <div class="control-section">
        <div class="section-header collapsed"><span class="collapse-triangle">▼</span> Imaging</div>
        <div class="section-content hidden">
            <label class="parameter-label">Persistence
                <input id="persistence" type="range" min="0.25" max="0.99" step="0.01" value="0.35">
                <span></span>
            </label>
            <label class="parameter-label">Noise level
                <input id="noiseLevel" type="range" min="0" max="0.6" step="0.01" value="0.2">
            </label>
            <label class="parameter-label">Contrast opacity scale
                <input id="opacityScale" type="range" min="0" max="100" step="1" value="100">
                <span></span>
            </label>
            <label class="parameter-label">Contrast gain
                <input id="gain" type="range" min="0" max="5" step="0.1" value="5">
                <span></span>
            </label>
        </div>
    </div>

    <div class="control-section">
        <div class="section-header"><span class="collapse-triangle">▼</span> Injection</div>
        <div class="section-content">
            <label>Injection volume (ml)
                <input id="injVolume" type="range" min="0" max="200" step="0.5" value="100">
                <span></span>
            </label>
            

            <label class="parameter-label">Injection rate (ml/s)
                <input id="injRate" type="range" min="0" max="100" step="0.1" value="50">
                <span></span>
            </label>
            <label class="parameter-label">Injection duration (ms)
                <input id="injDuration" type="range" min="0" max="5000" step="100" value="2000">
                <span></span>
            </label>
        </div>
    </div>

    <button id="injectContrast">Inject</button>
    <button id="stopInjection" disabled>Stop Injection</button>
    <button id="modeToggle">Wireframe</button>
    <label><input id="renderVoxels" type="checkbox" checked> Render contrast</label>
</div>

<div id="monitor">
    <div class="vitalBox" id="hrBox">
        <canvas id="ecgCanvas" width="300" height="100"></canvas>
        <div class="vitalLabel">HR: <span id="hrValue">0</span></div>
    </div>
    <div class="vitalBox" id="bpBox">
        <canvas id="bpCanvas" width="300" height="100"></canvas>
        <div class="vitalLabel">BP: <span id="bpValue">0/0</span></div>
    </div>
</div>

<div id="carm-preview"></div>
<div id="carm-controls">
    <div class="control-section">
        <div class="section-header"><span class="collapse-triangle">▼</span> C-arm</div>
        <div class="section-content">
            <div class="carm-readouts">
                <div class="carm-readout"><span class="plane-icon plane-transverse"></span><span id="carmYawReadout">AP 0°</span></div>
                <div class="carm-readout"><span class="plane-icon plane-sagittal"></span><span id="carmPitchReadout">CRA 0°</span></div>
                <div class="carm-readout"><span class="plane-icon plane-roll"></span><span id="carmRollReadout">Roll 0°</span></div>
            </div>
            <div class="carm-joystick-grid">
                <div class="carm-joystick-block">
                    <div class="carm-joystick-title">Angle</div>
                    <div id="angleJoystick" class="joystick">
                        <div id="angleJoystickHandle" class="joystick-handle"></div>
                    </div>
                    <div class="joystick-caption">LAO/RAO · CRA/CAU</div>
                    <div class="roll-control">
                        <button id="carmRollLeft" title="Rotate detector counterclockwise">↺</button>
                        <button id="carmRollRight" title="Rotate detector clockwise">↻</button>
                    </div>
                </div>
                <div class="carm-joystick-block">
                    <div class="carm-joystick-title">Position</div>
                    <div id="positionJoystick" class="joystick">
                        <div id="positionJoystickHandle" class="joystick-handle"></div>
                    </div>
                    <div id="carmZButtons">
                        <button id="carmZUp">Up</button>
                        <button id="carmZDown">Down</button>
                    </div>
                    <div class="joystick-caption">Table plane · height</div>
                </div>
            </div>
            <input id="carmX" type="hidden" min="-200" max="200" step="1" value="0">
            <input id="carmY" type="hidden" min="-1000" max="600" step="1" value="-90">
            <input id="carmZ" type="hidden" min="-200" max="400" step="1" value="60">
            <input id="carmDetDist" type="hidden" min="200" max="600" step="1" value="350">
        </div>
    </div>
</div>
<div id="perfStats">FPS: 0 | Mem: N/A</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.5/build/index.module.js",
        "three-bvh-csg": "https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.17/build/index.module.js",
        "three/examples/jsm/utils/BufferGeometryUtils.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/utils/BufferGeometryUtils.js",
        "three/examples/jsm/loaders/OBJLoader.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/OBJLoader.js"
    }
}
</script>
    <script type="module" src="./src/simulator.js?v=20260612catheter20"></script>
</body>
</html>
