<!doctype html><html lang="pl"><meta charset="utf-8"><title>Dokładność pamięci podręcznej projekcji</title>
<style>body{background:#14212a;color:#e5edf2;font:15px system-ui;margin:24px}pre{white-space:pre-wrap}</style>
<h1>Dokładność pamięci podręcznej projekcji</h1><pre id="results">Kompilacja testów GPU…</pre>
<script type="module">
import * as T from 'three';
import {contrastColumnQuadratureReference} from './helpers/contrastColumnQuadratureReference.js';
import {columnNearestReference} from './helpers/columnNearestReference.js';
import {contrastGpuDiagnosticShader} from './helpers/contrastGpuDiagnosticShader.js';
import {junctionContinuityFixture} from './helpers/contrastJunctionContinuityFixture.js';
import {FlowConcentrationField} from '../src/contrast/flowConcentrationField.js';
import {JunctionSurfaceReconstruction} from '../src/contrast/junctionSurfaceReconstruction.js';
import {buildAnatomicalColumnProjection} from '../src/contrast/anatomicalColumnProjection.js';
const output=document.querySelector('#results'),lines=[],resources=[],renderer=new T.WebGLRenderer({antialias:false});
const target=new T.WebGLRenderTarget(32,24,{type:T.FloatType,depthBuffer:false}),scene=new T.Scene();
let lost=false;renderer.domElement.addEventListener('webglcontextlost',()=>{lost=true;});
const assert=(value,message)=>{if(!value)throw Error(message);};
function overflowFixture(){
 const points=[new T.Vector3(0,12,0),new T.Vector3()],nodes=new Map(),edges=[];
 for(let i=0;i<40;i++){const angle=i*Math.PI*2/40;points.push(new T.Vector3(Math.cos(angle),Math.sin(angle),12));}
 points.forEach((point,id)=>nodes.set(id,{id,point,parentEdgeIndex:-1,childEdgeIndices:[]}));
 const links=[[0,1],...Array.from({length:40},(_,i)=>[1,i+2])];
 for(const[from,to]of links){const index=edges.length,start=points[from],end=points[to],length=start.distanceTo(end);
  nodes.get(from).childEdgeIndices.push(index);nodes.get(to).parentEdgeIndex=index;
  edges.push({index,start,end,length,axis:end.clone().sub(start).normalize(),startNodeId:from,endNodeId:to,
   radiusStart:2,radiusEnd:2,cellCount:32,cellLength:length/32,areas:new Float64Array(32).fill(4*Math.PI)});
 }
 for(const edge of edges){edge.parentEdgeIndex=nodes.get(edge.startNodeId).parentEdgeIndex;edge.childEdgeIndices=nodes.get(edge.endNodeId).childEdgeIndices;}
 const network={edges,nodes},offsets=Uint32Array.from(edges,e=>e.index*32),field=new FlowConcentrationField(network,offsets,edges.length*32);
 const values=new Float32Array(field.cellCount);
 for(const edge of edges)values.fill(edge.index===40?1:.1,offsets[edge.index],offsets[edge.index]+32);
 field.update(values);
 return{network,field,territories:Int32Array.from(edges,e=>e.index),continuations:new Int32Array(edges.length).fill(-1)};
}
function probe(f,center,arc){
 const depth=.02,geometry=new T.BoxGeometry(10,8,depth).toNonIndexed();geometry.translate(...center.toArray());
 const p=geometry.attributes.position.array;
 for(let i=0;i<p.length;i+=9)for(let k=0;k<3;k++)[p[i+3+k],p[i+6+k]]=[p[i+6+k],p[i+3+k]];
 const columns=new Float32Array(geometry.attributes.position.count*2);for(let i=0;i<columns.length;i+=2)columns.set([0,arc],i);
 geometry.setAttribute('columnCoordinate',new T.BufferAttribute(columns,2));
 const projection=buildAnatomicalColumnProjection(f.network,geometry,f.field,{territories:f.territories,continuations:f.continuations,junctionField:f.junctionField});
 projection.update(f.field.values,Float32Array.from(f.field.values,c=>1.2-c));
 const uniforms={...projection.uniforms,displayAlpha:{value:1},signalGain:{value:2/depth},debugMode:{value:false},debugColor:{value:new T.Color(1,1,1)},
  projectionCullActive:{value:false},projectionActiveMin:{value:new T.Vector3()},projectionActiveMax:{value:new T.Vector3()}};
 const shaders=[projection.fragmentShader,
  contrastGpuDiagnosticShader(projection.fragmentShader,'referenceHistory').replace(/float columnNearestRefined\([\s\S]*?\nfloat columnNearestCoordinate\(/, columnNearestReference + '\nfloat columnNearestCoordinate(').replace(/float junctionColumnAverage\([\s\S]*?\nvoid main\(\)/, contrastColumnQuadratureReference + '\nvoid main()').replace('float junctionColumnAverage(', '#define junctionColumnValue junctionColumnValueUncached\nfloat junctionColumnAverage('),
  projection.fragmentShader.replace('return junctionColumnValueUncached(point, a, sa, b, sb, componentA, componentB);','return vec3(7., beta, 0.);')];
 const materials=shaders.map(fragmentShader=>new T.ShaderMaterial({vertexShader:projection.vertexShader,fragmentShader,uniforms,
  side:T.BackSide,transparent:true,premultipliedAlpha:true,blending:T.AdditiveBlending,depthTest:false,depthWrite:false,toneMapped:false}));
 const mesh=new T.Mesh(geometry,materials[0]);projection.install(mesh);scene.add(mesh);
 resources.push({dispose(){scene.remove(mesh);projection.dispose();geometry.dispose();materials.forEach(m=>m.dispose());}});
 return{update(){projection.update(f.field.values,Float32Array.from(f.field.values,c=>1.2-c));},render(kind,angle,alpha,width=8,height=6){
  const camera=new T.OrthographicCamera(-width/2,width/2,height/2,-height/2,.1,250),radians=angle*Math.PI/180;
  camera.position.copy(center).add(new T.Vector3(Math.sin(radians)*100,0,Math.cos(radians)*100));camera.lookAt(center);camera.updateMatrixWorld(true);
  uniforms.displayAlpha.value=alpha;uniforms.columnRayCacheEnabled.value=kind!==1;uniforms.signalGain.value=2*Math.abs(Math.cos(radians))/depth;mesh.material=materials[kind];
  renderer.setRenderTarget(target);renderer.setClearColor(0,0);renderer.clear();renderer.render(scene,camera);
  const pixels=new Float32Array(32*24*4);renderer.readRenderTargetPixels(target,0,0,32,24,pixels);assert(!lost,'Utrata kontekstu GPU');return pixels;
 },remove(){scene.remove(mesh);}};
}
try{
 for(const mode of['T','Y','commonY']){
  const oblique=mode!=='T',f=junctionContinuityFixture(oblique);
  if(mode==='commonY'){f.junctionField=new JunctionSurfaceReconstruction(f.network,f.field,f.territories,f.continuations);f.junctionField.finish();}
  resources.push(f);const p=probe(f,new T.Vector3(3,0,0),30);
  for(const angle of[0,30,180])for(const alpha of[0,.35,1]){
   const expected=p.render(1,angle,alpha),actual=p.render(0,angle,alpha);let error=0,positive=0;
   for(let i=0;i<actual.length;i+=4){assert(Number.isFinite(actual[i]),'Nieprawidłowe stężenie');error=Math.max(error,Math.abs(actual[i]-expected[i]));positive+=actual[i]>0?1:0;}
   assert(positive>0,'Pusty test');assert(error<2e-6,`Różnica pola ${error}`);
   lines.push(`PASS ${mode}, ${angle}°, historia ${alpha}: maks. różnica ${error}.`);output.textContent=lines.join('\n');
   await new Promise(requestAnimationFrame);
  }
  for(const concentration of[0,.37])for(const alpha of[0,.35,1]){
   f.fill(()=>concentration);p.update();const expected=p.render(1,30,alpha),actual=p.render(0,30,alpha);let error=0;
   for(let i=0;i<actual.length;i+=4){assert(Number.isFinite(actual[i]),'Nieprawidłowe stałe pole');error=Math.max(error,Math.abs(actual[i]-expected[i]));}
   assert(error<2e-6,`Skrót jednorodnego pola: ${error}`);lines.push(`PASS stałe ${concentration}, historia ${alpha}: maks. różnica ${error}.`);
  }p.remove();
 }
 const f=overflowFixture(),p=probe(f,new T.Vector3(0,0,.6),12);
 const expected=p.render(1,0,1,.04,.04),actual=p.render(0,0,1,.04,.04),overflow=p.render(2,0,1,.04,.04);
 let error=0,fallback=0;for(let i=0;i<actual.length;i+=4){error=Math.max(error,Math.abs(expected[i]-actual[i]));fallback+=overflow[i]>6?1:0;}
 assert(fallback===32*24,`Nie wywołano nieograniczonej ścieżki: ${fallback}/768`);
 assert(error<2e-6,`Utrata gałęzi po przepełnieniu: ${error}`);
 lines.push(`PASS 41 ramion: wszystkie768pikseli korzystają z pełnej ścieżki; maks. różnica ${error}.`);
 document.body.dataset.status='pass';lines.push('PASS: zgodność wszystkich projekcji GPU, bez zmiany próbkowania.');
}catch(error){document.body.dataset.status='fail';lines.push('FAIL: '+error.message);console.error(error);}
finally{output.textContent=lines.join('\n');renderer.setRenderTarget(null);for(const r of resources.reverse())r.dispose();target.dispose();renderer.dispose();}
</script></html>
