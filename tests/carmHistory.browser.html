<!doctype html><html lang="pl"><meta charset="utf-8"><title>Kontrola obrazu powrotu z 90°</title><style>body{background:#171c25;color:#eee;font:16px system-ui}main{display:flex;gap:12px}figure{margin:0}#controls{position:fixed;left:-1000px;top:0}.joystick{width:120px;height:120px}.handle{width:20px;height:20px}</style><pre id="status">Ładowanie</pre><main></main><div id="controls"><input id="carmX" value="0"><input id="carmY" value="0"><input id="carmZ" value="60"><input id="carmDetDist" value="350"><div id="angleJoystick" class="joystick"><div id="angleJoystickHandle" class="handle"></div></div><span id="carmYawReadout"></span><span id="carmPitchReadout"></span><span id="carmRollReadout"></span></div>
<script type="module">
import * as T from 'three';import{createDebugVesselSurface}from'../src/debugVesselSurface.js';import{STLLoader}from'three/examples/jsm/loaders/STLLoader.js';import{transformAortaGeometry}from'../src/aortaTransform.js';import{generateVessel}from'../src/vesselGeometry.js';import{setupCArmControls}from'../src/carmControls.js';
const g=await new STLLoader().loadAsync('/res/Aorta_infrarenal_aneurysm.stl');transformAortaGeometry(g,generateVessel().vessel);g.computeVertexNormals();
const scene=new T.Scene();scene.background=new T.Color(0);const camera=new T.PerspectiveCamera(45,420/560,1,5000);scene.add(camera);const mesh=new T.Mesh(g,new T.MeshBasicMaterial({color:0x4f8dff,transparent:true,opacity:.18,depthWrite:false,side:T.DoubleSide}));mesh.position.y=-15;mesh.renderOrder=2.8;scene.add(mesh);
const realRAF=window.requestAnimationFrame;let tick,time=0;window.requestAnimationFrame=fn=>{tick=fn;return 1};setupCArmControls(camera,{branchPoint:{x:0,y:-210,z:0}},350);
const joystick=document.querySelector('#angleJoystick');const point=dy=>{const b=joystick.getBoundingClientRect();return{pointerId:1,clientX:b.left+60,clientY:b.top+60+dy}};
function step(n){for(let i=0;i<n;i++){time+=1000/22;tick(time);}}step(1);joystick.dispatchEvent(new PointerEvent('pointerdown',point(-50)));
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(420,560);const target=new T.WebGLRenderTarget(420,560);const records=[];
function record(label){renderer.setRenderTarget(target);renderer.render(scene,camera);const pixels=new Uint8Array(420*560*4);renderer.readRenderTargetPixels(target,0,0,420,560,pixels);renderer.setRenderTarget(null);renderer.render(scene,camera);const image=new Image();image.src=renderer.domElement.toDataURL();const f=document.createElement('figure');f.append(label,image);document.querySelector('main').append(f);records.push({pixels,p:camera.position.clone(),q:camera.quaternion.clone()});}
step(50);record('LAO 50° — przed dojściem do limitu');step(40);joystick.dispatchEvent(new PointerEvent('pointermove',point(50)));step(40);record('LAO 50° — po powrocie z 90°');window.requestAnimationFrame=realRAF;
let pixelsChanged=0,maxDifference=0;for(let i=0;i<records[0].pixels.length;i++){const delta=Math.abs(records[0].pixels[i]-records[1].pixels[i]);if(delta)pixelsChanged++;maxDifference=Math.max(maxDifference,delta);}
const surface=createDebugVesselSurface(g);surface.mesh.position.y=-15;surface.mesh.renderOrder=2.8;scene.remove(mesh);scene.add(surface.mesh);surface.prepare(renderer,camera);record('Przednia powierzchnia — test renderowania');
document.querySelector('#status').textContent=JSON.stringify({positionDifference:records[0].p.distanceTo(records[1].p),quaternionDifference:records[0].q.angleTo(records[1].q),changedChannels:pixelsChanged,maxDifference},null,2);
</script></html>
