<!doctype html><html lang="pl"><meta charset="utf-8"><title>Płynność uwalniania stentów</title>
<style>body{background:#14222e;color:#e6edf5;font:16px system-ui;margin:24px}h1{font-size:24px}canvas{max-width:100%;height:auto}button{padding:10px 20px;background:#254b66;color:white;border:1px solid #83b3d6;border-radius:6px}#status{font-variant-numeric:tabular-nums}</style>
<h1>Płynność uwalniania stentów</h1><p>Stały krok 1/60 s · koszulka 12 mm/s · zachowane długości tkaniny i drutów</p><button id="pause">Wstrzymaj</button><p id="status">Przygotowanie testu…</p><main></main>
<script type="module">
import * as THREE from 'three';
import {previewFixture} from './helpers/stentGraftPreviewFixture.js';
const {system,device:d}=previewFixture();system.delivery.visible=false;
const scene=new THREE.Scene();scene.background=new THREE.Color('#213342');scene.add(system.group);
const center=new THREE.Box3().setFromPoints(d.parts.flatMap(p=>p.points)).getCenter(new THREE.Vector3());
const camera=new THREE.OrthographicCamera(-55,55,75,-75,.1,1000);camera.position.copy(center).add(new THREE.Vector3(0,0,250));camera.lookAt(center);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(600,650);document.querySelector('main').append(renderer.domElement);
let step=0,paused=false,last=0,acc=0,maxCloth=0,maxMetal=0;
const snapshot=()=>[d.sewnMesh.geometry.attributes.position.array.slice(),...d.parts.map(p=>p.rings.geometry.attributes.instanceStart.array.slice())];let previous=snapshot();
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Wznów':'Wstrzymaj';};
function animate(now){if(last&&!paused)acc+=Math.min(.05,(now-last)/1000);last=now;
while(acc>=1/60&&step<1000){
 system.updateAccess('right',1/60,null,{deviceId:d.id,release:step<850?'sheath':'tip'});step++;acc-=1/60;
 const next=snapshot();for(let k=0;k<next.length;k++){let max=0;for(let i=0;i<next[k].length;i+=3)max=Math.max(max,Math.hypot(...[0,1,2].map(c=>next[k][i+c]-previous[k][i+c])));if(k===0)maxCloth=Math.max(maxCloth,max);else maxMetal=Math.max(maxMetal,max);}previous=next;
 document.querySelector('#status').textContent=`Czas ${(step/60).toFixed(2)} s · Koszulka ${d.sheathWithdrawal.toFixed(1)} mm · Największy ruch na krok: tkanina ${maxCloth.toFixed(3)} mm, druty ${maxMetal.toFixed(3)} mm`;
}
renderer.render(scene,camera);requestAnimationFrame(animate);}requestAnimationFrame(animate);
</script></html>
