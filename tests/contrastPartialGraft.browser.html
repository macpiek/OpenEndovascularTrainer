<!doctype html><html lang="pl"><meta charset="utf-8"><title>Kontrast podczas częściowego rozłożenia</title><style>body{background:#15202b;color:#e6edf5;font:16px system-ui;margin:24px}main{display:flex;gap:18px}section{flex:1;min-width:0}canvas{width:100%}h1{font-size:24px}h2{font-size:18px}</style><h1>Kontrast przy częściowo odsłoniętym korpusie</h1><p>Tkanina odsłonięta tylko do 36 mm. Błękit: światło, pomarańcz: worek (kolor diagnostyczny). Czas symulacji.</p><main></main><script type="module">
import * as THREE from 'three';
import {partialFlowFixture} from './helpers/partialContrastFixture.js';
import {createContrastReleaseSurface} from '../src/devices/stentGraftContrastSurface.js';
import {ContrastVolumeRenderer} from '../src/contrast/contrastVolumeRenderer.js';
for(const seconds of [.8,1.2,2]) {
 const f=partialFlowFixture(),s=createContrastReleaseSurface([f.device],1),n=f.system.flowNetwork;
 f.system.setStentGraftSurface(s);const r=new ContrastVolumeRenderer(f.system);
 for(let i=0;i<Math.round(seconds*100);i++){if(i<150)n.depositIodine(0,0,36);f.system.update(.01);}
 r.setDebugMode(true);r.update();for(const m of r._trappedMesh.material)m.uniforms.debugColor.value.set('#ffb15b');
 const scene=new THREE.Scene();scene.background=new THREE.Color('black');scene.add(r.group);
 for(const p of s.parts)scene.add(new THREE.Mesh(p.mesh.geometry,new THREE.MeshBasicMaterial({wireframe:true,color:'#eeeeee',transparent:true,opacity:.3})));
 const camera=new THREE.OrthographicCamera(-72,72,42,-42,.1,500);camera.position.set(44,0,200);camera.lookAt(44,0,0);
 const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(370,245);renderer.render(scene,camera);
 const section=document.createElement('section'),h=document.createElement('h2'),p=document.createElement('p');h.textContent=seconds.toFixed(1)+' s';p.textContent='Dopływ przez odsłonięty koniec do worka: '+n.stentGraftRemodeling.sac.receivedMassMg.toFixed(2)+' mg';section.append(h,renderer.domElement,p);document.querySelector('main').append(section);
}
</script></html>
